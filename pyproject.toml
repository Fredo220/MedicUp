[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openoe-lite"
version = "1.0.0"
description = "OpenOE-Lite — Open-source evidence-based medical RAG system"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.23",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "pydantic>=2.7",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
openoe = "openoe.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["openoe*"]

[tool.setuptools.package-data]
openoe = ["config/*.yaml", "static/*"]