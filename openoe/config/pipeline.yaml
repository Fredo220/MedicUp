# MedicUp (based on OpenOE-Lite)

retrieval:
  routes:
    openalex_kw:
      enabled: true
      source: openalex
      mode: keyword
      limit: 30
      config:
        base_url: "https://api.openalex.org"
        email: "${OPENALEX_EMAIL:}"
        api_key: "${OPENALEX_API_KEY:}"
      filters:
        date_range_years: 10

    tavily_web:
      enabled: true
      source: tavily
      mode: scholarly          # restrict to include_domains; any other mode = open web
      limit: 10
      config:
        api_key: "${TAVILY_API_KEY:}"
        search_depth: basic
        include_domains:
          - pubmed.ncbi.nlm.nih.gov
          - pmc.ncbi.nlm.nih.gov
          - europepmc.org
          - doi.org
          - nature.com
          - cell.com
          - sciencedirect.com
          - thelancet.com
          - nejm.org
          - jamanetwork.com
          - bmj.com
          - academic.oup.com
          - link.springer.com
          - onlinelibrary.wiley.com
          - frontiersin.org
          - biorxiv.org
          - medrxiv.org

merge:
  papers:
    strategy: rrf
    rrf_k: 60
    dedup: doi
    total_limit: 80

stages:
  safety:
    enabled: true
    model: "${MEDICUP_SMALL_MODEL:Qwen/Qwen3-30B-A3B-Instruct-2507}"

  enhance:
    hyde:
      enabled: true
      model: "${MEDICUP_SMALL_MODEL:Qwen/Qwen3-30B-A3B-Instruct-2507}"
    translate:
      enabled: true
      model: "${MEDICUP_SMALL_MODEL:Qwen/Qwen3-30B-A3B-Instruct-2507}"
    keywords:
      enabled: true
      model: "${MEDICUP_STRONG_MODEL:Qwen/Qwen3-235B-A22B-Instruct-2507}"
      max_keywords: 15

  filter:
    paper_relevance:
      enabled: true
      model: "${MEDICUP_SMALL_MODEL:Qwen/Qwen3-30B-A3B-Instruct-2507}"
      concurrency: 20

  web_context:                 # Tavily: background for the answer + supporting sources per cited paper
    enabled: true
    api_key: "${TAVILY_API_KEY:}"
    search_depth: basic
    max_results: 5
    include_answer: true
    feed_answer: true          # pass web sources to the answer model as low-priority context
    supporting:
      top_k: 5                 # cited papers to enrich
      max_results: 3           # supporting sources per paper

  answer:
    model: "${MEDICUP_STRONG_MODEL:Qwen/Qwen3-235B-A22B-Instruct-2507}"
    max_tokens: 4096
    prompt_template: generate_answer_v4
    system_prompt: medical_expert

discovery:
  small_model: "${MEDICUP_SMALL_MODEL:Qwen/Qwen3-30B-A3B-Instruct-2507}"
  strong_model: "${MEDICUP_STRONG_MODEL:Qwen/Qwen3-235B-A22B-Instruct-2507}"
  embedding_model: "${MEDICUP_EMBED_MODEL:Qwen/Qwen3-Embedding-8B}"
  judge_k: 25
  limit: 20
  openalex:
    base_url: "https://api.openalex.org"
    email: "${OPENALEX_EMAIL:}"
    api_key: "${OPENALEX_API_KEY:}"
  signals:
    cited_by_seeds:
      enabled: true
    cites_seeds:
      enabled: true
    related:
      enabled: true
    s2_recommendation:
      enabled: true
    search:
      enabled: true
    web:
      enabled: true

llm:
  default_provider: nebius
  providers:
    nebius:
      api_key: "${NEBIUS_API_KEY:}"
      base_url: "${NEBIUS_BASE_URL:https://api.tokenfactory.nebius.com/v1}"
  retry:
    max_retries: 3
    backoff:
      - 2
      - 4
      - 6