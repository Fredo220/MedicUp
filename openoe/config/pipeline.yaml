# Open OE Lite

retrieval:
  routes:
    openalex_kw:
      enabled: true
      source: openalex
      mode: keyword
      limit: 30
      config:
        base_url: "https://api.openalex.org"
        email: "${OPENALEX_EMAIL:}"
        api_key: "${OPENALEX_API_KEY:}"
      filters:
        date_range_years: 10

    tavily_web:
      enabled: true
      source: tavily
      mode: scholarly          # restrict to include_domains; any other mode = open web
      limit: 10
      config:
        api_key: "${TAVILY_API_KEY:}"
        search_depth: basic
        include_domains:
          - pubmed.ncbi.nlm.nih.gov
          - pmc.ncbi.nlm.nih.gov
          - europepmc.org
          - doi.org
          - nature.com
          - cell.com
          - sciencedirect.com
          - thelancet.com
          - nejm.org
          - jamanetwork.com
          - bmj.com
          - academic.oup.com
          - link.springer.com
          - onlinelibrary.wiley.com
          - frontiersin.org
          - biorxiv.org
          - medrxiv.org

merge:
  papers:
    strategy: rrf
    rrf_k: 60
    dedup: doi
    total_limit: 80

stages:
  safety:
    enabled: true
    model: openai/gpt-oss-20b
    provider: google-vertex

  enhance:
    hyde:
      enabled: true
      model: openai/gpt-oss-120b
      provider: google-vertex
    translate:
      enabled: true
      model: openai/gpt-oss-120b
      provider: google-vertex
    keywords:
      enabled: true
      model: openai/gpt-5.4
      max_keywords: 15

  filter:
    paper_relevance:
      enabled: true
      model: openai/gpt-oss-20b
      provider: google-vertex
      concurrency: 20

  web_context:                 # Tavily: background for the answer + supporting sources per cited paper
    enabled: true
    api_key: "${TAVILY_API_KEY:}"
    search_depth: basic
    max_results: 5
    include_answer: true
    feed_answer: true          # pass web sources to the answer model as low-priority context
    supporting:
      top_k: 5                 # cited papers to enrich
      max_results: 3           # supporting sources per paper

  answer:
    model: openai/gpt-5.4
    # provider 不指定 → OpenRouter 自动选最优
    max_tokens: 4096
    prompt_template: generate_answer_v4
    system_prompt: medical_expert

llm:
  default_provider: openrouter
  providers:
    openrouter:
      api_key: "${OPENROUTER_API_KEY:}"
      base_url: "https://openrouter.ai/api/v1"
  retry:
    max_retries: 3
    backoff:
      - 2
      - 4
      - 6